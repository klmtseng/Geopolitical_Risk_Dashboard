name: Hourly ETL, Build, and Deploy

on:
  schedule:
    # Every hour at :47. GitHub starts scheduled runs late when it is busy, sometimes
    # by hours; the ETL catches up on everything published since its last run.
    - cron: '47 * * * *'
  workflow_dispatch: # Allows manual triggering (on any branch; only main deploys)

# One run at a time per branch, so two runs never write the state at once.
concurrency:
  group: etl-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Taipei
  # ETL state (hourly aggregates and the last published data files) lives on its
  # own branch as a single commit that is replaced on every run, so the hourly
  # data never accumulates in the history of main. Runs from other branches use
  # a separate preview state.
  STATE_BRANCH: ${{ github.ref == 'refs/heads/main' && 'etl-state' || 'etl-state-preview' }}

jobs:
  etl_build:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # To replace the state branch
      issues: write        # To create issues on failure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Restore ETL state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          if git ls-remote --exit-code --heads "$remote" "$STATE_BRANCH" > /dev/null; then
            git clone --quiet --depth 1 --branch "$STATE_BRANCH" "$remote" _state
            rm -rf _state/.git
          else
            echo "No $STATE_BRANCH branch yet; starting with empty state."
          fi
          mkdir -p _state/state _state/public

      - name: Run ETL script
        run: python etl.py --state-dir _state/state --out-dir _state/public

      - name: Save ETL state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd _state
          git init --quiet --initial-branch "$STATE_BRANCH"
          git config user.name 'GitHub Actions Bot'
          git config user.email 'actions-bot@github.com'
          git add -A
          git commit --quiet -m "ETL state: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push --quiet --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" "$STATE_BRANCH"

      - name: Copy data files into the site
        run: |
          mkdir -p static/data
          cp _state/public/*.json static/data/
          ls -la static/data

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build frontend application
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

      - name: Notify on failure
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # gh cli needs this
        run: |
          echo "Workflow failed. Creating an issue."
          gh issue create \
            --title "ETL / build failed on $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --body "The ETL and build workflow failed. Please check the logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "Issue creation failed (non-fatal). See workflow logs for details."

  deploy:
    needs: etl_build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write         # To deploy to GitHub Pages
      id-token: write      # For GitHub Pages OIDC token
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
